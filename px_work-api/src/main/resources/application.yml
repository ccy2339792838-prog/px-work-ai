server:
  port: 8082 # 由于8081端口被占用，临时修改为8082

app:
  upload-dir: D:/px/backend/uploads

spring:
  application:
    name: px_work-api
  # 🔴 下面这三行就是专门加的：解除上传大小限制（最大 1GB）
  servlet:
    multipart:
      max-file-size: 1024MB     
      max-request-size: 1024MB  
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/platorm?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: "123456"
  web:
    resources:
      static-locations: classpath:/static/,classpath:/public/,classpath:/resources/,classpath:/META-INF/resources/

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl # 开启控制台 SQL 打印
  global-config:
    db-config:
      id-type: auto # 配置主键自增

sa-token:
  token-name: satoken
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  is-share: false
  is-read-header: true
  is-read-cookie: true
  token-style: uuid

springdoc:
  swagger-ui:
    tags-sorter: alpha
    operations-sorter: alpha

ai:
  dify:
    base-url: "http://192.168.1.51:8099/v1"
    generate-key: "app-oQqcYxrLtdxuX5CoBTcDoFGg"
    grade-key: "app-2YRW4daPCMB7oPc4wZ8yC1Qb"
    outline-key: "app-TsW33qnmMXIDlY7DhGwSB0Al"

# logging 配置必须与 spring 平级，不能缩进到 ai 下面
logging:
  level:
    com.zaxxer.hikari: DEBUG
    org.springframework.jdbc: DEBUG
  # 腾讯云 TRTC 直播配置
trtc:
  appid: 1600135547
  secret-key: "48cd6305f31e1a916ad6dc792ef8c93b3dd746141765d43d159e9d15de38c63b"
  expire-time: 86400  # 门票有效期：86400秒（刚好是一天）